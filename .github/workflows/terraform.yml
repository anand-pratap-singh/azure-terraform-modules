name: Terraform CI Pipeline

on:
  push:
    branches:
      - feature/new-branch

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1 - TERRAFORM PLAN
  # ==========================================
  terraform:
    name: Terraform Validate and Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: parent_module

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Terraform Format Check
        run: terraform fmt -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file="terraform.tfvars" -out=tfplan

      - name: Convert Plan to JSON
        run: terraform show -json tfplan > plan.json

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: parent_module/plan.json


  # ==========================================
  # JOB 2 - INFRACOST
  # ==========================================
  infracost:
    name: Infracost Cost Scan
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: parent_module

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Run Infracost Cost Estimate
        run: |
          infracost breakdown \
            --path=parent_module/plan.json \
            --format=table


  # ==========================================
  # JOB 3 - CREATE PULL REQUEST NOTIFICATION
  # ==========================================
  create-pr:
    name: Create Pull Request
    runs-on: ubuntu-latest
    needs: infracost

    if: github.event_name == 'push' && github.ref_name == 'feature/new-branch'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head feature/new-branch \
            --title "Merge feature/new-branch into main" \
            --body "Terraform validation, plan, and Infracost checks completed successfully."